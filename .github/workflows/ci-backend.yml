name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'apps/api/**'
      - 'infrastructure/**'
      - 'tests/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'apps/api/**'
      - 'infrastructure/**'
      - 'tests/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  backend-test:
    name: Lint, Type Check & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis_user
          POSTGRES_PASSWORD: aegis_password
          POSTGRES_DB: aegis_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://aegis_user:aegis_password@localhost:5432/aegis_db
        run: |
          cd apps/api
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          python -m pytest apps/api/tests tests/integration -v --durations=10
